<!-- コメントセクション -->
<section class="comment-section" id="comment-section">
    <!-- コメント投稿フォーム -->
    <form id="commentForm">
        <input type="hidden" name="post" value="{{ selected_post.id }}">
        <!-- 名前 -->
        <div class="comment-row">
            <div class="comment-field">
                <p>お名前・ニックネーム</p><input type="text" name="nickname" required>
            </div>
            <!-- 段位 -->
            <div class="level-group">
                <label for="level">あなたの段位</label>
                <select name="level" id="level">
                    <option value="beginner">初心者仲間</option>
                    <option value="1_year">剣道歴1年</option>
                    <option value="shodan" selected>初段</option>
                    <option value="nidan">二段</option>
                    <option value="sandan">三段</option>
                    <option value="4th_dan_plus">四段以上</option>
                    <option value="instructor">指導員・先生</option>
                </select>
            </div>
        </div>
        <!-- コメント -->
        <textarea id="commentText" name="comment" rows="4" placeholder="コメントを書く" required></textarea>
        <!-- ボタン -->
        <button type="submit" class="btn btn-primary btn-sm">コメントを投稿</button>
        <div id="commentMessage" class="comment-message"></div>

    </form>
    <!-- コメント一覧 -->
    <div class="comment-header">
        <h3 class="comment-title">コメント</h3>
        <span class="comment-count">{{ selected_post.comments.all|length }}件</span>
    </div>

    <div class="comment-list">
        {% for item in selected_post.comments.all %}
        <div class="comment-card" data-level="{{ item.level }}">
            <div class="comment-top">
                <div class="comment-author">
                    <span class="comment-nickname">{{ item.nickname }}</span>
                    <span class="level-badge">{{ item.get_level_display }}</span>
                    <span class="comment-date">{{ item.created_at|date:"n/j H:i" }}</span>
                </div>
            </div>
            <p class="comment-text">{{ item.comment }}</p>
        </div>
        {% empty %}
        <p class="no-comments">まだコメントはありません</p>
        {% endfor %}
    </div>
</section>
<script>
    (function () {
        const form = document.getElementById("commentForm");
        if (!form) return;

        const section = form.closest(".comment-section");
        const list = section.querySelector(".comment-list");
        const countEl = section.querySelector(".comment-count");
        const submitBtn = form.querySelector('button[type="submit"]');
        const message = document.getElementById("commentMessage");

        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(";").shift();
            return null;
        }

        function formatDateTime(iso) {
            const d = new Date(iso);
            const month = d.getUTCMonth() + 1;
            const day = d.getUTCDate();
            const hours = String(d.getUTCHours()).padStart(2, "0");
            const minutes = String(d.getUTCMinutes()).padStart(2, "0");
            return `${month}/${day} ${hours}:${minutes}`;
        }

        function createCommentCard(data) {
            const card = document.createElement("div");
            card.className = "comment-card";
            card.dataset.level = data.level;

            const top = document.createElement("div");
            top.className = "comment-top";

            const author = document.createElement("div");
            author.className = "comment-author";

            const nick = document.createElement("span");
            nick.className = "comment-nickname";
            nick.textContent = data.nickname;

            const badge = document.createElement("span");
            badge.className = "level-badge";
            badge.textContent = data.level_display;

            const date = document.createElement("span");
            date.className = "comment-date";
            date.textContent = formatDateTime(data.created_at);

            author.append(nick, badge, date);
            top.appendChild(author);

            const text = document.createElement("p");
            text.className = "comment-text";
            text.textContent = data.comment;

            card.append(top, text);
            return card;
        }

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            message.textContent = "";
            message.className = "comment-message";
            submitBtn.disabled = true;

            const formData = new FormData(form);

            try {
                const response = await fetch("/api/comments/", {
                    method: "POST",
                    headers: {
                        "X-CSRFToken": getCookie("csrftoken"),
                    },
                    body: formData,
                });

                const result = await response.json().catch(() => ({}));

                if (!response.ok) {
                    let detail = result.detail;
                    if (!detail) {
                        for (const key of Object.keys(result)) {
                            const errors = result[key];
                            if (Array.isArray(errors) && errors.length) {
                                detail = errors[0];
                                break;
                            }
                        }
                    }
                    message.textContent = detail || "コメントの投稿に失敗しました。";
                    message.classList.add("error");
                    return;
                }

                list.prepend(createCommentCard(result));
                const noComments = section.querySelector(".no-comments");
                if (noComments) noComments.remove();
                countEl.textContent = list.querySelectorAll(".comment-card").length + "件";
                form.reset();
                message.textContent = "コメントを投稿しました。";
                message.classList.add("success");
            } catch (err) {
                message.textContent = "通信エラーが発生しました。もう一度お試しください。";
                message.classList.add("error");
            } finally {
                submitBtn.disabled = false;
            }
        });
    })();
</script>
