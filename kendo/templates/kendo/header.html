<header class="site-header">
    <div class="container header-inner">
        <a href="{% url 'main' %}" class="brand">
            <span class="brand-mark" aria-hidden="true">剣</span>
            <span class="brand-text">
                <span class="brand-title">Kendo Lab</span>
                <span class="brand-sub">ケンドウ・ラボ</span>
            </span>
        </a>
        <nav class="site-nav" aria-label="メインナビゲーション">
            <ul>
                <li><a href="#detail-area">投稿詳細</a></li>
                {% if selected_post %}
                <li><a href="#comment-section">コメント</a></li>
                {% endif %}
            </ul>
        </nav>
        <button type="button" id="openCreateModalBtn" class="btn btn-primary header-post-btn">＋ 新規投稿</button>
    </div>
</header>

<div id="createModal" class="modal-overlay">
    <div class="modal-dialog">
        <div class="modal-head">
            <span>新規投稿</span>
            <button id="closeCreateModalBtn" class="modal-close" aria-label="閉じる">×</button>
        </div>
        <iframe id="createModalFrame" class="modal-iframe" src="/api/register/"></iframe>
    </div>
</div>

<script>
    const openBtn = document.getElementById("openCreateModalBtn");
    const modal = document.getElementById("createModal");
    const closeBtn = document.getElementById("closeCreateModalBtn");
    const frame = document.getElementById("createModalFrame");

    function openModal() {
        modal.classList.add("open");
        frame.src = "/api/register/";
    }

    function closeModal() {
        modal.classList.remove("open");
        frame.src = "about:blank";
    }

    openBtn.addEventListener("click", openModal);
    closeBtn.addEventListener("click", closeModal);
    modal.addEventListener("click", (e) => {
        if (e.target === modal) closeModal();
    });
    document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeModal();
    });
</script>
