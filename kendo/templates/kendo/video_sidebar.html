<!-- 1. 動的カテゴリフィルター -->
<h2 class="side-bar-title">カテゴリ</h2>
<div class="sb-tabs">
    {% for filter_name in filters %}
        <a href="?category={{ filter_name|urlencode }}"
           class="sb-link{% if filter_name == selected_category %} active{% endif %}"
           {% if filter_name == selected_category %}aria-current="page"{% endif %}>
            {{ filter_name }}
        </a>
    {% endfor %}
</div>

<!-- 2. 投稿一覧（最大5件） -->
<h2 class="side-bar-title">他の剣士の稽古動画・画像 ({{ posts|length }})</h2>
<div class="side-post-list">
    {% for post in posts %}
        <a href="?category={{ selected_category|urlencode }}&selected_id={{ post.id }}"
           class="post-link{% if selected_post and post.id == selected_post.id %} active{% endif %}"
           {% if selected_post and post.id == selected_post.id %}aria-current="true"{% endif %}>
            <span class="post-link-body">
                <span class="post-link-title">{{ post.title }}</span>
                <span class="post-link-meta">{{ post.nickname }} • {{ post.experience_period }}</span>
            </span>
            <span class="post-cat">{{ post.get_post_type_display }}</span>
        </a>
    {% empty %}
        <p class="post-empty">該当する投稿がありません。</p>
    {% endfor %}
</div>
