<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【動画】跳躍素振り50本！剣道・下半身強化トレーニング</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700&family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="kendo/static/kendo/css/style.css">
    <style>
        body {
            background: transparent;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .video-wrap {
            border-radius: 24px;
            overflow: hidden;
            background: #0c0a08;
            box-shadow: var(--shadow-md);
        }

        .video-wrap video {
            display: block;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #0c0a08;
        }

        .video-info {
            background: var(--white);
            border: 1px solid rgba(43, 38, 34, 0.07);
            border-radius: 24px;
            padding: 26px 28px;
            box-shadow: var(--shadow-sm);
        }

        .video-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
        }

        .video-title {
            font-size: clamp(1.3rem, 2.4vw, 1.9rem);
            line-height: 1.45;
            font-weight: 700;
            color: var(--ink);
        }

        .video-meta {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 18px;
            margin-top: 10px;
            font-size: 0.85rem;
            color: var(--ink-soft);
        }

        .video-meta .dot {
            opacity: 0.4;
        }

        .video-desc {
            margin-top: 18px;
            padding-top: 18px;
            border-top: 2px solid var(--red-soft);
            font-size: 0.96rem;
            line-height: 2;
            color: var(--ink-soft);
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <div class="video-wrap">
        <video controls playsinline preload="metadata">
            <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4" type="video/mp4">
            お使いのブラウザは動画の再生に対応していません。
        </video>
    </div>

    <article class="video-info" id="detail-area">
        <div class="video-tags">
            <span class="post-cat">素振り</span>
            <span class="post-cat">跳躍素振り</span>
            <span class="post-cat">トレーニング</span>
        </div>
        <h1 class="video-title">【動画】跳躍素振り50本！剣道・下半身強化トレーニング</h1>
        <div class="video-meta">
            <time datetime="2026-09-10">投稿日：2026/09/10</time>
            <span class="dot">・</span>
            <span>視聴回数 1,248 回</span>
        </div>
        <p class="video-desc">
            跳躍素振り（ちょうやくすぶり）は、竹刀を振りながら前進・後退し、体軸を安定させながら踏み込みのリズムを鍛えるトレーニングです。
            この動画では、基本の構えから跳躍素振りを50本続けて行います。お腹まわりと下半身の強化に効くので、稽古前のウォームアップにもおすすめです。
            【構成】構えと持ち方 → 跳躍素振り50本 → 呼吸を整えるクールダウン
        </p>
    </article>
</body>
